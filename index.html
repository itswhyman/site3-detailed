<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velvet & Bloom Clinic</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="#" class="logo" id="logo">LUMINA</a>
      <nav class="nav">
        <a href="#hizmetler">Hizmetler</a>
        <a href="#galeri">Galeri</a>
        <a href="#hakkimizda">Hakkımızda</a>
        <a href="#yorumlar">Yorumlar</a>
        <a href="#iletisim">İletişim</a>
      </nav>
      <a href="#iletisim" class="btn btn-sm" id="header-cta">Randevu</a>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="container hero-content">
      <p class="hero-eyebrow">Güzellik & Bakım</p>
      <h1 id="hero-title">Kendinizi Ödüllendirin</h1>
      <p class="hero-sub" id="hero-sub"></p>
      <a href="#iletisim" class="btn btn-primary" id="hero-cta">Randevu Al</a>
    </div>
  </section>

  <section id="hizmetler" class="services">
    <div class="container">
      <div class="section-header">
        <span class="section-label">Hizmetlerimiz</span>
        <h2>Size özel bakım deneyimi</h2>
      </div>
      <div class="services-grid" id="services-grid"></div>
    </div>
  </section>

  <section id="galeri" class="gallery">
    <div class="container">
      <div class="section-header">
        <span class="section-label">Galeri</span>
        <h2>Atmosferimizden kareler</h2>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <section id="hakkimizda" class="about">
    <div class="container about-grid">
      <div class="about-text">
        <span class="section-label">Hakkımızda</span>
        <h2 id="about-title"></h2>
        <p id="about-text"></p>
        <ul class="about-features" id="about-features"></ul>
      </div>
      <div class="about-visual">
        <img id="about-img" src="" alt="Salon" class="about-img">
      </div>
    </div>
  </section>

  <section id="yorumlar" class="testimonials">
    <div class="container">
      <div class="section-header">
        <span class="section-label">Yorumlar</span>
        <h2>Misafirlerimiz ne diyor?</h2>
      </div>
      <div class="testi-grid" id="testi-grid"></div>
    </div>
  </section>

  <section id="iletisim" class="contact">
    <div class="container">
      <div class="section-header">
        <span class="section-label">İletişim</span>
        <h2>Randevu için bize ulaşın</h2>
      </div>
      <div class="contact-grid">
        <div class="contact-info" id="contact-info"></div>
        <form class="contact-form" id="contact-form">
          <input type="text" name="name" placeholder="Adınız" required>
          <input type="tel" name="phone" placeholder="Telefon" required>
          <select name="service" id="form-services"></select>
          <textarea name="message" rows="4" placeholder="Mesajınız (isteğe bağlı)"></textarea>
          <button type="submit" class="btn btn-primary">Gönder</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="logo-text" id="footer-logo">LUMINA</span>
        <p id="footer-tagline"></p>
      </div>
      <div class="footer-social" id="footer-social"></div>
      <p class="footer-copy" id="footer-copy"></p>
    </div>
  </footer>

  <script src="assets/js/defaults.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/public.js"></script>
</body>
</html>
